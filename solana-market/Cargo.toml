[package]
name = "slot-market"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
publish = false
build = "build.rs"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
no-entrypoint = []

[dependencies]
solana-program = "=2.2.1"

[build-dependencies]
serde_json = "=1.0.140"

[dev-dependencies]
litesvm = "=0.6.1"
solana-sdk = "=2.2.1"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(target_os, values("solana"))'] }
